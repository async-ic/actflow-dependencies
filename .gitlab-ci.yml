# Builds 3 portable variants of the same dependency tree, differing only by
# base image + -march level (component versions are unchanged):
#   x86-64-v2 : CentOS 7 -> ABI 3.10   (baseline toolchain)
#   x86-64-v3 : AlmaLinux 9 -> ABI 5.14
#   x86-64-v4 : AlmaLinux 9 -> ABI 5.14

stages:
  - prepare
  - build
  - test
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  ACT_HOME: ${CI_PROJECT_DIR}/opt/act

# sources tarball required for copyleft-license compliance
prepare:sources:
  stage: prepare
  image: centos:7.2.1511
  needs: []
  cache:
    key: "sources-$CI_COMMIT_SHA"
    paths:
      - ./
    policy: push
  script:
    - bash packaging/001-pack_sources.sh
  artifacts:
    paths:
      - actflow_dependencies_sources*.tar.gz
    expire_in: 1 week

# build/test stages only pull the checkout from cache (see prepare:sources) instead of
# re-cloning + re-fetching submodules in every job
.source_cache: &source_cache
  key: "sources-$CI_COMMIT_SHA"
  paths:
    - ./
  policy: pull

.build_centos7: &build_centos7
  image: centos:7.2.1511
  cache:
    <<: *source_cache
  script:
    - bash packaging/000-check_arch_level.sh
    - source packaging/centos7_ci_build_environment.sh
    - bash packaging/centos7_install_build_system.sh
    - source packaging/centos7_ci_build_environment.sh
    - bash packaging/003-build.sh
    - touch "actflow_dependency_build_$(date '+%Y-%m-%d')_${CI_COMMIT_SHORT_SHA:-local}"
    - bash packaging/005-pack_binaries.sh

.build_alma9: &build_alma9
  image: almalinux:9
  cache:
    <<: *source_cache
  script:
    - bash packaging/000-check_arch_level.sh
    - source packaging/alma9_ci_build_environment.sh
    - bash packaging/alma9_install_build_system.sh
    - source packaging/alma9_ci_build_environment.sh
    - bash packaging/003-build.sh
    - touch "actflow_dependency_build_$(date '+%Y-%m-%d')_${CI_COMMIT_SHORT_SHA:-local}"
    - bash packaging/005-pack_binaries.sh

build:x86-64-v2:
  <<: *build_centos7
  stage: build
  needs: []
  variables:
    ARCH_LEVEL: x86-64-v2
    GIT_STRATEGY: none
  artifacts:
    paths:
      - actflow_dependencies_package_*.tar.gz
    expire_in: 1 week

build:x86-64-v3:
  <<: *build_alma9
  stage: build
  needs: []
  allow_failure: true
  variables:
    ARCH_LEVEL: x86-64-v3
    GIT_STRATEGY: none
  artifacts:
    paths:
      - actflow_dependencies_package_*.tar.gz
    expire_in: 1 week

build:x86-64-v4:
  <<: *build_alma9
  stage: build
  needs: []
  allow_failure: true
  variables:
    ARCH_LEVEL: x86-64-v4
    GIT_STRATEGY: none
  artifacts:
    paths:
      - actflow_dependencies_package_*.tar.gz
    expire_in: 1 week

# distro portability matrix: each packaged variant tested against target OSes
.test_script: &test_script
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
  cache:
    - <<: *source_cache
  before_script:
    # opensuse/leap base image ships without tar/gzip/make
    - if command -v zypper >/dev/null 2>&1; then zypper --non-interactive install -y make tar gzip; fi
  script:
    - bash packaging/000-check_arch_level.sh
    - mkdir install
    - tar -C install -xf actflow_dependencies_package_*.tar.gz
    - export ACT_HOME=$(pwd)/install/act
    - bash packaging/006-test.sh

# distro kernel vs. almalinux:9 (5.14): v2 targets distros older than the alma9 build host,
# v3/v4 target distros newer-or-equal to it (glibc built against alma9 can't run on older glibc)
test:x86-64-v2:
  <<: *test_script
  stage: test
  needs: ["build:x86-64-v2"]
  variables:
    ARCH_LEVEL: x86-64-v2
  parallel:
    matrix:
      - DISTRO_IMAGE:
          - centos:7.2.1511        # kernel 3.10
          - rockylinux/rockylinux:8 # kernel 4.18
          - debian:oldoldstable     # bullseye, kernel 5.10
          - ubuntu:20.04            # kernel 5.4
          - ubuntu:18.04            # kernel 4.15
          - ubuntu:16.04            # kernel 4.4
          - fedora:20               # kernel 3.11
  image: $DISTRO_IMAGE

test:x86-64-v3:
  <<: *test_script
  stage: test
  needs: ["build:x86-64-v3"]
  rules:
    - if: '$DISTRO_IMAGE =~ /^archlinux\//'
      allow_failure: true
    - when: on_success
  variables:
    ARCH_LEVEL: x86-64-v3
  parallel:
    matrix:
      - DISTRO_IMAGE:
          - almalinux:9           # kernel 5.14
          - almalinux:10          # kernel 6.12
          - debian:stable          # trixie, kernel 6.12
          - debian:oldstable       # bookworm, kernel 6.1
          - ubuntu:22.04           # kernel 5.15
          - ubuntu:24.04           # kernel 6.8
          - ubuntu:26.04           # kernel 6.14
          - opensuse/leap:15       # 15.6, kernel 6.4
          - archlinux/archlinux:latest # rolling
          - fedora:latest          # rolling
  image: $DISTRO_IMAGE

test:x86-64-v4:
  <<: *test_script
  stage: test
  needs: ["build:x86-64-v4"]
  rules:
    - if: '$DISTRO_IMAGE =~ /^archlinux\//'
      allow_failure: true
    - when: on_success
  variables:
    ARCH_LEVEL: x86-64-v4
  parallel:
    matrix:
      - DISTRO_IMAGE:
          - almalinux:9           # kernel 5.14
          - almalinux:10          # kernel 6.12
          - debian:stable          # trixie, kernel 6.12
          - debian:oldstable       # bookworm, kernel 6.1
          - ubuntu:22.04           # kernel 5.15
          - ubuntu:24.04           # kernel 6.8
          - ubuntu:26.04           # kernel 6.14
          - opensuse/leap:15       # 15.6, kernel 6.4
          - archlinux/archlinux:latest # rolling
          - fedora:latest          # rolling
  image: $DISTRO_IMAGE

# uses script: not the declarative release: keyword - that only does $VAR substitution, can't run head/rename commands below
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - prepare:sources
    - build:x86-64-v2
    - build:x86-64-v3
    - build:x86-64-v4
    - test:x86-64-v2
    - test:x86-64-v3
    - test:x86-64-v4
  script:
    - |
      PACKAGE_BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/actflow-dependencies/${CI_COMMIT_SHORT_SHA}"
      upload() {
        # $1 = local file (glob-matched, date/hash-suffixed), $2 = stable published name
        local_file=$(ls $1)
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${local_file}" \
          "${PACKAGE_BASE_URL}/$2"
      }
      upload "actflow_dependencies_sources_*.tar.gz" "actflow_dependencies_sources.tar.gz"
      upload "actflow_dependencies_package_x86-64-v2_*.tar.gz" "actflow_dependencies_package_x86-64-v2.tar.gz"
      upload "actflow_dependencies_package_x86-64-v3_*.tar.gz" "actflow_dependencies_package_x86-64-v3.tar.gz"
      upload "actflow_dependencies_package_x86-64-v4_*.tar.gz" "actflow_dependencies_package_x86-64-v4.tar.gz"

      RELEASE_TAG="$(head -n 1 packaging/release_tag.md)"
      RELEASE_TITLE="$(head -n 1 packaging/release_titel.md)"
      RELEASE_DESCRIPTION="$(head -n 1 packaging/release_description.md)"

      release-cli create \
        --tag-name "${RELEASE_TAG}" \
        --name "${RELEASE_TITLE}" \
        --description "${RELEASE_DESCRIPTION}" \
        --assets-link "{\"name\":\"actflow_dependencies_sources.tar.gz\",\"url\":\"${PACKAGE_BASE_URL}/actflow_dependencies_sources.tar.gz\"}" \
        --assets-link "{\"name\":\"actflow_dependencies_package_x86-64-v2.tar.gz\",\"url\":\"${PACKAGE_BASE_URL}/actflow_dependencies_package_x86-64-v2.tar.gz\"}" \
        --assets-link "{\"name\":\"actflow_dependencies_package_x86-64-v3.tar.gz\",\"url\":\"${PACKAGE_BASE_URL}/actflow_dependencies_package_x86-64-v3.tar.gz\"}" \
        --assets-link "{\"name\":\"actflow_dependencies_package_x86-64-v4.tar.gz\",\"url\":\"${PACKAGE_BASE_URL}/actflow_dependencies_package_x86-64-v4.tar.gz\"}"
