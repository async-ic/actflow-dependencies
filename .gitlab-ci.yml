# distro portability matrix: each packaged variant tested against target OSes
.test_script: &test_script
  # superproject-only checkout gives the test scripts
  before_script:
    # per-image TEST_DEPS_INSTALL_CMD (set in the matrix) provides a modern-TLS curl/wget
    - eval "$TEST_DEPS_INSTALL_CMD"
    - bash packaging/gitlab-registry-transfer.sh down "actflow_dependencies_package_${ARCH_LEVEL}.tar.gz" "actflow_dependencies_package_${ARCH_LEVEL}.tar.gz"
  script:
    - bash packaging/000-check_arch_level.sh
    - mkdir install
    - tar -C install -xf actflow_dependencies_package_*.tar.gz
    - export ACT_HOME=$(pwd)/install/act
    - bash packaging/006-test.sh

test:x86-64-v2:
  <<: *test_script
  stage: test
  needs: ["prepare:sources", "build:x86-64-v2"]
  variables:
    ARCH_LEVEL: x86-64-v2
    GIT_SUBMODULE_STRATEGY: none
    TEST_DEPS_INSTALL_CMD: "true" # default no-op for images already carrying a usable curl
  parallel:
    matrix:
      - DISTRO_IMAGE: centos:7.2.1511         # kernel 3.10
        TEST_DEPS_INSTALL_CMD: "sed -i 's/^mirrorlist=/#mirrorlist=/g; s|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo && yum install -y ca-certificates"
      - DISTRO_IMAGE: rockylinux/rockylinux:8 # kernel 4.18
      - DISTRO_IMAGE: almalinux:9             # kernel 5.14
      - DISTRO_IMAGE: debian:oldoldstable     # bullseye, kernel 5.10
        TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
      - DISTRO_IMAGE: ubuntu:20.04            # kernel 5.4
        TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
      - DISTRO_IMAGE: ubuntu:18.04            # kernel 4.15
        TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
      - DISTRO_IMAGE: ubuntu:16.04            # kernel 4.4
        TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
      - DISTRO_IMAGE: fedora:25               # kernel 4.8 (oldest whose TLS stack can still reach the registry)
  image: $DISTRO_IMAGE

