# Builds 3 portable variants of the same dependency tree, differing only by
# base image + -march level (component versions are unchanged):
#   x86-64-v2 : CentOS 7 -> ABI 3.10   (baseline toolchain)
#   x86-64-v3 : AlmaLinux 9 -> ABI 5.14
#   x86-64-v4 : AlmaLinux 9 -> ABI 5.14

# a YYYY-MM-DD_hash tag is auto-created by the release job for an already-published
# release; its tag pipeline would only rebuild and re-release what already exists.
# drop the whole pipeline for such tags (human release tags use another format).
workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d{4}-\d{2}-\d{2}_/'
      when: never
    - when: always

stages:
  - prepare
  - build
  - test
  - release
  - clean

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  ACT_HOME: ${CI_PROJECT_DIR}/opt/act

# sources for build + tarball required for copyleft-licenses.
prepare:sources:
  stage: prepare
  image: almalinux:9
  needs: []
  # gnu.org does not allow shallow fetching on commits that are in dead banches -> bison submodule
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
    GIT_SUBMODULE_PATHS: " src/org-kitware-cmake \
 src/cas-openmathlib-openblas \
 src/tamu-drtimothyaldendavis-suitesparse \
 src/sandia-trilinos-trilinos \
 src/sandia-xyce-xyce \
 src/org-madler-zlib \
 src/org-debian-ncurses \
 src/org-debian-libedit \
 src/org-tcltk-tcl \
 src/org-tcltk-tk \
 src/org-libffi-libffi \
 src/org-boostorg-boost \
 src/org-numactl-numactl \
 src/org-fmtlib-fmt \
 src/org-libeigen-eigen \
 src/org-llvm-llvm-project \
 src/org-gnu-readline \
 src/org-debian-fftw3 \
 src/org-gnu-gcc \
 src/org-pmodels-mpich \
 src/lbl-xiaoyeli-superlu_dist \
 src/lbl-xiaoyeli-superlu \
 src/umn-karypislab-parmetis \
 src/umn-karypislab-gklib \
 src/umn-karypislab-metis \
 src/org-gnu-automake \
 src/org-westes-flex "
  script:
    - yum install git -y
    - git submodule update --init --depth 1 src/org-gnu-bison
    # bison symlinks m4/m4.m4 (AC_PROG_GNU_M4) + data/m4sugar/*.m4 out of submodules/autoconf.
    # its pinned commit sits on a dead branch gnu.org won't shallow-serve, so clone a tag
    # with the rebased commits.
    - rm -rf src/org-gnu-bison/submodules/autoconf
    - git clone --depth 1 --branch v2.71 git://git.sv.gnu.org/autoconf.git src/org-gnu-bison/submodules/autoconf
    - (cd src/org-gnu-bison; git submodule update --init --recursive --depth 1 gnulib)
    # freeze bison's version into .tarball-version: build stage has no .git and the
    # submodule is shallow (no tags), so git-version-gen would yield UNKNOWN. read NEWS.
    - (cd src/org-gnu-bison; sed -n 's/^\* Noteworthy changes in release \([0-9][0-9.]*\).*/\1/p' NEWS | head -1 > .tarball-version)
    - bash packaging/001-pack_sources.sh
    # sources move through the package registry (job artifacts exceed the size limit);
    # propagate the one minted version to every downstream job via dotenv
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_sources_*.tar.gz)" "actflow_dependencies_sources.tar.gz"
    - echo "ACTFLOW_DEP_VERSION=$(head -n1 actflow_dep.version)" > actflow_dep.env
  artifacts:
    reports:
      dotenv: actflow_dep.env
    expire_in: 1 week

.build_centos7: &build_centos7
  image: centos:7.2.1511
  script:
    - bash packaging/000-check_arch_level.sh
    - bash packaging/centos7_install_build_system.sh
    - bash packaging/gitlab-registry-transfer.sh down actflow_dependencies_sources.tar.gz actflow_dependencies_sources.tar.gz
    - tar --exclude-vcs -xzf actflow_dependencies_sources.tar.gz
    - source packaging/centos7_ci_build_environment.sh
    - bash packaging/002-build.sh
    - bash packaging/003-pack_binaries.sh
    - bash packaging/004-build_testing.sh
    - bash packaging/005-pack_binaries_testing.sh
    # push the binaries to the registry (no job artifact); release just links to them
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_package_${ARCH_LEVEL}_*.tar.gz)" "actflow_dependencies_package_${ARCH_LEVEL}.tar.gz"
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_testing_package_${ARCH_LEVEL}_*.tar.gz)" "actflow_dependencies_testing_package_${ARCH_LEVEL}.tar.gz"
  # per-build logs kept off the truncated console; upload on failure too so builds stay diagnosable
  artifacts:
    when: always
    paths:
      - logs/
    expire_in: 1 week

.build_alma9: &build_alma9
  image: almalinux:9
  before_script:
    - bash packaging/gitlab-registry-transfer.sh down actflow_dependencies_sources.tar.gz actflow_dependencies_sources.tar.gz
    - tar --exclude-vcs -xzf actflow_dependencies_sources.tar.gz
  script:
    - bash packaging/000-check_arch_level.sh
    - bash packaging/alma9_install_build_system.sh
    - source packaging/alma9_ci_build_environment.sh
    - bash packaging/002-build.sh
    - bash packaging/003-pack_binaries.sh
    - bash packaging/004-build_testing.sh
    - bash packaging/005-pack_binaries_testing.sh
    # push the binaries to the registry (no job artifact); release just links to them
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_package_${ARCH_LEVEL}_*.tar.gz)" "actflow_dependencies_package_${ARCH_LEVEL}.tar.gz"
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_testing_package_${ARCH_LEVEL}_*.tar.gz)" "actflow_dependencies_testing_package_${ARCH_LEVEL}.tar.gz"
  # per-build logs kept off the truncated console; upload on failure too so builds stay diagnosable
  artifacts:
    when: always
    paths:
      - logs/
    expire_in: 1 week

build:x86-64-v2:
  <<: *build_centos7
  stage: build
  needs: ["prepare:sources"]
  variables:
    ARCH_LEVEL: x86-64-v2
    GIT_SUBMODULE_STRATEGY: none

# x86-64-v3 / v4 disabled: no v3/v4 CI runners available yet. re-enable these
