# Builds 4 portable variants of the same dependency tree, differing only by
# base image + -march level (component versions are unchanged):
#   x86-64-v2 : CentOS 7 -> ABI 3.10   (baseline toolchain)
#   x86-64-v3 : AlmaLinux 9 -> ABI 5.14
#   x86-64-v4 : AlmaLinux 9 -> ABI 5.14
#   armv8.5-a : Rocky 9 -> ABI 5.14    (aarch64, tart VM runners)

# a YYYY-MM-DD_hash tag is auto-created by the release job for an already-published
# release; its tag pipeline would only rebuild and re-release what already exists.
# drop the whole pipeline for such tags (human release tags use another format).
workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d{4}-\d{2}-\d{2}_/'
      when: never
    - when: always

stages:
  - prepare
  - build
  - test
  - release
  - clean

# use internal mirrors to reduce traffic &
# gnu.org does not allow shallow fetching on commits that are in not advertised branch head -> bison submodule
# redirect submodule clones to internal mirrors at fetch time (git >=2.31)
include:
  - project: 'mirror/gitlab-profile'     
    ref: main
    file: '/git-mirror.yml'

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  ACT_HOME: ${CI_PROJECT_DIR}/opt/act
  # arm64 tart VM images from lo
  TART_IMAGES: ${CI_REGISTRY}/mirror/cirruslabs/images

# sources for build + tarball required for copyleft-licenses.
prepare:sources:
  stage: prepare
  image: almalinux:9
  needs: []
  tags: [container]
  script:
    - yum install git bzip2 -y
    - bash packaging/001-pack_sources.sh
    # sources move through the package registry (job artifacts exceed the size limit);
    # propagate the one minted version to every downstream job via dotenv
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_sources_*.tar.gz)" "actflow_dependencies_sources.tar.gz"
    - echo "ACTFLOW_DEP_VERSION=$(head -n1 actflow_dep.version)" > actflow_dep.env
  artifacts:
    reports:
      dotenv: actflow_dep.env
    expire_in: 1 week

.build_el7: &build_el7
  image: centos:7.2.1511
  script:
    - bash packaging/000-check_arch_level.sh
    - bash packaging/el7_install_build_system.sh
    - bash packaging/gitlab-registry-transfer.sh down actflow_dependencies_sources.tar.gz actflow_dependencies_sources.tar.gz
    - tar --exclude-vcs -xzf actflow_dependencies_sources.tar.gz
    - source packaging/el7_ci_build_environment.sh
    - bash packaging/002-build.sh
    - bash packaging/003-pack_binaries.sh
    - bash packaging/004-build_testing.sh
    - bash packaging/005-pack_binaries_testing.sh
    # push the binaries to the registry (no job artifact); release just links to them
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_package_${ARCH_LEVEL}_*.tar.gz)" "actflow_dependencies_package_${ARCH_LEVEL}.tar.gz"
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_testing_package_${ARCH_LEVEL}_*.tar.gz)" "actflow_dependencies_testing_package_${ARCH_LEVEL}.tar.gz"
  # per-build logs kept off the truncated console; upload on failure too so builds stay diagnosable
  artifacts:
    when: always
    paths:
      - logs/
    expire_in: 1 week

# image per job: almalinux:9 container (x86-64-v3/v4) / mirrored rocky:9 tart VM (armv8.5-a)
.build_el9: &build_el9
  image: $BUILD_IMAGE
  before_script:
    - bash packaging/gitlab-registry-transfer.sh down actflow_dependencies_sources.tar.gz actflow_dependencies_sources.tar.gz
    - tar --exclude-vcs -xzf actflow_dependencies_sources.tar.gz
  script:
    - bash packaging/000-check_arch_level.sh
    - bash packaging/el9_install_build_system.sh
    - source packaging/el9_ci_build_environment.sh
    - bash packaging/002-build.sh
    - bash packaging/003-pack_binaries.sh
    - bash packaging/004-build_testing.sh
    - bash packaging/005-pack_binaries_testing.sh
    # push the binaries to the registry (no job artifact); release just links to them
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_package_${ARCH_LEVEL}_*.tar.gz)" "actflow_dependencies_package_${ARCH_LEVEL}.tar.gz"
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_testing_package_${ARCH_LEVEL}_*.tar.gz)" "actflow_dependencies_testing_package_${ARCH_LEVEL}.tar.gz"
  # per-build logs kept off the truncated console; upload on failure too so builds stay diagnosable
  artifacts:
    when: always
    paths:
      - logs/
    expire_in: 1 week

# runner tags: build+test carry the arch tag pinning the CPU baseline that
# 000-check_arch_level.sh verifies, plus the executor tag - "container" (docker) or
# "tart" (arm64 VM runners, which boot VM images instead of containers).
build:x86-64-v2:
  <<: *build_el7
  stage: build
  needs: ["prepare:sources"]
  tags: [x86-64-v2, container]
  variables:
    ARCH_LEVEL: x86-64-v2
    GIT_SUBMODULE_STRATEGY: none

build:x86-64-v3:
  <<: *build_el9
  stage: build
  needs: ["prepare:sources"]
  tags: [x86-64-v3, container]
  variables:
    ARCH_LEVEL: x86-64-v3
    BUILD_IMAGE: almalinux:9
    GIT_SUBMODULE_STRATEGY: none

build:x86-64-v4:
  <<: *build_el9
  stage: build
  needs: ["prepare:sources"]
  tags: [x86-64-v4, container]
  variables:
    ARCH_LEVEL: x86-64-v4
    BUILD_IMAGE: almalinux:9
    GIT_SUBMODULE_STRATEGY: none

# aarch64: the tart runners only boot VM images -> Rocky 9
build:armv8.5-a:
  <<: *build_el9
  stage: build
  needs: ["prepare:sources"]
  tags: [armv8.5-a, tart]
  # the VM images carry no git, the runner needs it before it can clone
  hooks:
    pre_get_sources_script:
      - sudo dnf install -y git
  variables:
    ARCH_LEVEL: armv8.5-a
    BUILD_IMAGE: ${TART_IMAGES}/rocky:9
    GIT_SUBMODULE_STRATEGY: none
    # heavy c++ TUs (eigen lapack) peak ~2GB per job
    MAKE_JOBS: "2"

# distro portability matrix: each packaged variant tested against target OSes
.test_script: &test_script
  # superproject-only checkout gives the test scripts
  before_script:
    # per-image TEST_DEPS_INSTALL_CMD (set in the matrix) provides the download and
    # unpack tools the image lacks: a modern-TLS curl/wget, tar and gzip
    - eval "$TEST_DEPS_INSTALL_CMD"
    - bash packaging/gitlab-registry-transfer.sh down "actflow_dependencies_package_${ARCH_LEVEL}.tar.gz" "actflow_dependencies_package_${ARCH_LEVEL}.tar.gz"
  script:
    - bash packaging/000-check_arch_level.sh
    - mkdir install
    - tar -C install -xf actflow_dependencies_package_*.tar.gz
    - export ACT_HOME=$(pwd)/install/act
    - bash packaging/006-test.sh

test:x86-64-v2:
  <<: *test_script
  stage: test
  needs: ["prepare:sources", "build:x86-64-v2"]
  tags: [x86-64-v2, container]
  variables:
    ARCH_LEVEL: x86-64-v2
    GIT_SUBMODULE_STRATEGY: none
    TEST_DEPS_INSTALL_CMD: "true" # default no-op for images already carrying a usable curl
  # the oldest release of each distro, proving the compatibility floor, plus the newer
  # ones that still get security updates.
  parallel:
    matrix:
      - DISTRO_IMAGE: centos:7.2.1511         # kernel 3.10
        TEST_DEPS_INSTALL_CMD: "sed -i 's/^mirrorlist=/#mirrorlist=/g; s|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo && yum install -y ca-certificates"
      - DISTRO_IMAGE: rockylinux/rockylinux:8 # kernel 4.18
      - DISTRO_IMAGE: opensuse/leap:15        # 15.6, kernel 6.4
        TEST_DEPS_INSTALL_CMD: "zypper --non-interactive install tar gzip"
      - DISTRO_IMAGE: ubuntu:16.04            # kernel 4.4, oldest ubuntu
        TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
      - DISTRO_IMAGE: ubuntu:22.04            # kernel 5.15, LTS standard support to 2027-04
        TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
      - DISTRO_IMAGE: debian:bullseye         # 11, kernel 5.10, oldest debian, EOL 2026-08-31
        # EOL: main on archive.debian.org, bullseye-security expired and not archived yet
        TEST_DEPS_INSTALL_CMD: "sed -i '/bullseye-security/d; s|deb.debian.org/debian|archive.debian.org/debian|' /etc/apt/sources.list && apt-get update -qq && apt-get install -y curl"
      - DISTRO_IMAGE: debian:bookworm         # 12, kernel 6.1, LTS team since 2026-07-11
        TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
      - DISTRO_IMAGE: fedora:25               # kernel 4.8 (oldest whose TLS stack can still reach the registry)
  image: $DISTRO_IMAGE

# distro matrix for the ABI 5.14 builds, shared by v3/v4 (only ARCH_LEVEL/tags differ).
# only releases still in their normal support cycle
.test_matrix_x86_abi_514: &test_matrix_x86_abi_514
  matrix:
    - DISTRO_IMAGE: almalinux:9             # kernel 5.14
    - DISTRO_IMAGE: almalinux:10            # kernel 6.12
    - DISTRO_IMAGE: debian:stable           # trixie, kernel 6.12
      TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
    - DISTRO_IMAGE: debian:testing          # rolling
      TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
    - DISTRO_IMAGE: ubuntu:24.04            # kernel 6.8
      TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
    - DISTRO_IMAGE: ubuntu:26.04            # kernel 6.14
      TEST_DEPS_INSTALL_CMD: "apt-get update -qq && apt-get install -y curl"
    - DISTRO_IMAGE: opensuse/leap:16        # 16.0, kernel 6.12
    - DISTRO_IMAGE: archlinux/archlinux:latest # rolling
    - DISTRO_IMAGE: fedora:latest           # rolling

test:x86-64-v3:
  <<: *test_script
  stage: test
  needs: ["prepare:sources", "build:x86-64-v3"]
  tags: [x86-64-v3, container]
  rules:
    - if: '$DISTRO_IMAGE =~ /^archlinux\/|^debian:testing$/'
      allow_failure: true
    - when: on_success
  variables:
    ARCH_LEVEL: x86-64-v3
    GIT_SUBMODULE_STRATEGY: none
    TEST_DEPS_INSTALL_CMD: "true" # default no-op for images already carrying a usable curl
  parallel: *test_matrix_x86_abi_514
  image: $DISTRO_IMAGE

test:x86-64-v4:
  <<: *test_script
  stage: test
  needs: ["prepare:sources", "build:x86-64-v4"]
  tags: [x86-64-v4, container]
  rules:
    - if: '$DISTRO_IMAGE =~ /^archlinux\/|^debian:testing$/'
      allow_failure: true
    - when: on_success
  variables:
    ARCH_LEVEL: x86-64-v4
    GIT_SUBMODULE_STRATEGY: none
    TEST_DEPS_INSTALL_CMD: "true" # default no-op for images already carrying a usable curl
  parallel: *test_matrix_x86_abi_514
  image: $DISTRO_IMAGE

# aarch64 targets: limited to the mirrored tart VM images, nstalls need sudo, the VMs run the job unprivileged.
test:armv8.5-a:
  <<: *test_script
  stage: test
  needs: ["prepare:sources", "build:armv8.5-a"]
  tags: [armv8.5-a, tart]
  # the VM images carry no git, the runner needs it before it can clone; the deb
  # images get their curl in the same call, one apt-get update for both
  hooks:
    pre_get_sources_script:
      - eval "$VM_DEPS_INSTALL_CMD"
  variables:
    ARCH_LEVEL: armv8.5-a
    GIT_SUBMODULE_STRATEGY: none
    TEST_DEPS_INSTALL_CMD: "true" # tart deps are installed pre-clone instead
    VM_DEPS_INSTALL_CMD: "sudo dnf install -y git binutils" # rpm images, deb images override
  parallel:
    matrix:
      - DISTRO_IMAGE: ${TART_IMAGES}/rocky:9        # glibc 2.34, the build image
      - DISTRO_IMAGE: ${TART_IMAGES}/ubuntu:24.04   # kernel 6.8
        VM_DEPS_INSTALL_CMD: &deb_vm_deps "sudo apt-get update -qq && sudo apt-get install -y git curl"
        CI_DEBUG_TRACE: "true"
      - DISTRO_IMAGE: ${TART_IMAGES}/ubuntu:22.04   # kernel 5.15, LTS standard support to 2027-04
        VM_DEPS_INSTALL_CMD: *deb_vm_deps
      - DISTRO_IMAGE: ${TART_IMAGES}/debian:trixie  # 13, kernel 6.12
        VM_DEPS_INSTALL_CMD: *deb_vm_deps
        CI_DEBUG_TRACE: "true"
      - DISTRO_IMAGE: ${TART_IMAGES}/debian:bookworm # 12, kernel 6.1
        VM_DEPS_INSTALL_CMD: *deb_vm_deps
      - DISTRO_IMAGE: ${TART_IMAGES}/fedora:42      # kernel 6.14
      - DISTRO_IMAGE: ${TART_IMAGES}/fedora:39
      - DISTRO_IMAGE: ${TART_IMAGES}/fedora:38
  image: $DISTRO_IMAGE

probe:tart:
  stage: test
  tags: [armv8.5-a, tart]
  needs: []
  image: ${TART_IMAGES}/${PROBE_IMAGE}
  variables:
    GIT_STRATEGY: none
    CI_DEBUG_TRACE: "true"
  parallel:
    matrix:
      - PROBE_IMAGE: [debian:trixie, rocky:9]
  script:
    - echo probe-ok

# one release job per arch, each only linking its own packages, so a delayed or failed
# arch still leaves the others released. 
.release: &release
  stage: release
  image: buildpack-deps:stable-scm # curl; jq added below
  tags: [container]
  resource_group: release
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apt-get -q update -y >/dev/null && apt-get -q install -y jq >/dev/null
  script:
    - sh packaging/008-release.sh "${ACTFLOW_DEP_VERSION}" "${ARCH_LEVEL}"

release:x86-64-v2:
  <<: *release
  needs: ["prepare:sources", "build:x86-64-v2", "test:x86-64-v2"]
  variables:
    ARCH_LEVEL: x86-64-v2
    GIT_SUBMODULE_STRATEGY: none

release:x86-64-v3:
  <<: *release
  needs: ["prepare:sources", "build:x86-64-v3", "test:x86-64-v3"]
  variables:
    ARCH_LEVEL: x86-64-v3
    GIT_SUBMODULE_STRATEGY: none

release:x86-64-v4:
  <<: *release
  needs: ["prepare:sources", "build:x86-64-v4", "test:x86-64-v4"]
  variables:
    ARCH_LEVEL: x86-64-v4
    GIT_SUBMODULE_STRATEGY: none

# arch-independent (only links the arm packages), so it stays on the container runners
release:armv8.5-a:
  <<: *release
  needs: ["prepare:sources", "build:armv8.5-a", "test:armv8.5-a"]
  variables:
    ARCH_LEVEL: armv8.5-a
    GIT_SUBMODULE_STRATEGY: none

# Retention sweep: one job for all arches, gated on a successful release
cleanup:packages:
  stage: clean
  image: buildpack-deps:stable-scm # git+curl; jq + GNU date added below
  tags: [container]
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - release:x86-64-v2
    - release:x86-64-v3
    - release:x86-64-v4
    - release:armv8.5-a
  before_script:
    - apt-get -q update -y >/dev/null && apt-get -q install -y jq >/dev/null
  script:
    - sh packaging/007-cleanup_old_packages.sh "${ACTFLOW_DEP_VERSION}"
