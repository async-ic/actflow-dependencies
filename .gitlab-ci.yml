# Builds 3 portable variants of the same dependency tree, differing only by
# base image + -march level (component versions are unchanged):
#   x86-64-v2 : CentOS 7 -> ABI 3.10   (baseline toolchain)
#   x86-64-v3 : AlmaLinux 9 -> ABI 5.14
#   x86-64-v4 : AlmaLinux 9 -> ABI 5.14

stages:
  - prepare
  - build
  - test
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  ACT_HOME: ${CI_PROJECT_DIR}/opt/act

# sources tarball required for copyleft-license compliance, and doubles as the single
# checkout the build stage extracts instead of re-cloning + re-fetching submodules
prepare:sources:
  stage: prepare
  image: almalinux:9
  needs: []
  # gnu.org does not allow shallow fetching on commits that are in dead banches -> bison submodule
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
    GIT_SUBMODULE_PATHS: " src/org-kitware-cmake \
 src/cas-openmathlib-openblas \
 src/tamu-drtimothyaldendavis-suitesparse \
 src/sandia-trilinos-trilinos \
 src/sandia-xyce-xyce \
 src/org-madler-zlib \
 src/org-debian-ncurses \
 src/org-debian-libedit \
 src/org-tcltk-tcl \
 src/org-tcltk-tk \
 src/org-libffi-libffi \
 src/org-boostorg-boost \
 src/org-numactl-numactl \
 src/org-fmtlib-fmt \
 src/org-libeigen-eigen \
 src/org-gnu-readline \
 src/org-debian-fftw3 \
 src/org-gnu-gcc \
 src/org-pmodels-mpich \
 src/lbl-xiaoyeli-superlu_dist \
 src/lbl-xiaoyeli-superlu \
 src/umn-karypislab-parmetis \
 src/umn-karypislab-gklib \
 src/umn-karypislab-metis \
 src/org-gnu-automake \
 src/org-westes-flex "
  script:
    - yum install git -y
    - git submodule update --init --depth 1 src/org-gnu-bison
    # manual clone is untracked -> wipe before re-cloning so a second run does not abort on the existing path
    - (cd src/org-gnu-bison; git submodule init submodules/autoconf; cd submodules/autoconf; rm -rf autoconf; git clone --depth 1 --branch v2.71 git://git.sv.gnu.org/autoconf.git)
    - (cd src/org-gnu-bison; git submodule update --init --depth 1 gnulib)
    - bash packaging/001-pack_sources.sh
    # sources move through the package registry (job artifacts exceed the size limit);
    # propagate the one minted version to every downstream job via dotenv
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_sources_*.tar.gz)" "actflow_dependencies_sources.tar.gz"
    - echo "ACTFLOW_DEP_VERSION=$(cat actflow_dep.version)" > actflow_dep.env
  artifacts:
    reports:
      dotenv: actflow_dep.env
    expire_in: 1 week

.build_centos7: &build_centos7
  image: centos:7.2.1511
  script:
    - bash packaging/000-check_arch_level.sh
    - source packaging/centos7_ci_build_environment.sh
    - bash packaging/centos7_install_build_system.sh
    - bash packaging/gitlab-registry-transfer.sh down actflow_dependencies_sources.tar.gz actflow_dependencies_sources.tar.gz
    - tar --exclude-vcs -xzf actflow_dependencies_sources.tar.gz
    - source packaging/centos7_ci_build_environment.sh
    - bash packaging/003-build.sh
    - touch "actflow_dependency_build_$(cat actflow_dep.version)"
    - bash packaging/005-pack_binaries.sh
    # push the binaries to the registry (no job artifact); release just links to them
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_package_${ARCH_LEVEL}_*.tar.gz)" "actflow_dependencies_package_${ARCH_LEVEL}.tar.gz"

.build_alma9: &build_alma9
  image: almalinux:9
  before_script:
    - bash packaging/gitlab-registry-transfer.sh down actflow_dependencies_sources.tar.gz actflow_dependencies_sources.tar.gz
    - tar --exclude-vcs -xzf actflow_dependencies_sources.tar.gz
  script:
    - bash packaging/000-check_arch_level.sh
    - source packaging/alma9_ci_build_environment.sh
    - bash packaging/alma9_install_build_system.sh
    - source packaging/alma9_ci_build_environment.sh
    - bash packaging/003-build.sh
    - touch "actflow_dependency_build_$(cat actflow_dep.version)"
    - bash packaging/005-pack_binaries.sh
    # push the binaries to the registry (no job artifact); release just links to them
    - bash packaging/gitlab-registry-transfer.sh up "$(ls actflow_dependencies_package_${ARCH_LEVEL}_*.tar.gz)" "actflow_dependencies_package_${ARCH_LEVEL}.tar.gz"

build:x86-64-v2:
  <<: *build_centos7
  stage: build
  needs: ["prepare:sources"]
  variables:
    ARCH_LEVEL: x86-64-v2
    GIT_SUBMODULE_STRATEGY: none

