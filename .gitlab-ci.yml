# uses script: not the declarative release: keyword - that only does $VAR substitution, can't run head/rename commands below
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - prepare:sources
    - build:x86-64-v2
#    - build:x86-64-v3
#    - build:x86-64-v4
    - test:x86-64-v2
#    - test:x86-64-v3
#    - test:x86-64-v4
  before_script:
    # jq + GNU date for the retention sweep (curl + release-cli ship in the image)
    - apk add --no-cache jq coreutils >/dev/null 2>&1 || true
  script:
    - |
      # version was minted once in prepare and carried here via dotenv; a tag pipeline
      # publishes under the tag (kept forever), else it is YYYY-MM-DD_hash, which the
      # retention sweep below thins. also the release git tag. the sources + binaries
      # are already in the registry (uploaded by prepare + build), so only link them.
      RELEASE_VERSION="${ACTFLOW_DEP_VERSION}"
      PACKAGE_BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/actflow-dependencies/${RELEASE_VERSION}"

      RELEASE_TITLE="$(head -n 1 packaging/release_titel.md)"
      RELEASE_DESCRIPTION="$(head -n 1 packaging/release_description.md)"

      release-cli create \
        --tag-name "${RELEASE_VERSION}" \
        --name "${RELEASE_TITLE}" \
        --description "${RELEASE_DESCRIPTION}" \
        --assets-link "{\"name\":\"actflow_dependencies_sources.tar.gz\",\"url\":\"${PACKAGE_BASE_URL}/actflow_dependencies_sources.tar.gz\"}" \
        --assets-link "{\"name\":\"actflow_dependencies_package_x86-64-v2.tar.gz\",\"url\":\"${PACKAGE_BASE_URL}/actflow_dependencies_package_x86-64-v2.tar.gz\"}"
        # --assets-link "{\"name\":\"actflow_dependencies_package_x86-64-v3.tar.gz\",\"url\":\"${PACKAGE_BASE_URL}/actflow_dependencies_package_x86-64-v3.tar.gz\"}" \
        # --assets-link "{\"name\":\"actflow_dependencies_package_x86-64-v4.tar.gz\",\"url\":\"${PACKAGE_BASE_URL}/actflow_dependencies_package_x86-64-v4.tar.gz\"}"

      # retention: keep 5 newest dated versions + one per 60 days, delete the rest
      bash packaging/007-cleanup_old_packages.sh "${RELEASE_VERSION}" || true
